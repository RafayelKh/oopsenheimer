[project]
name = "radcraft-compiler"
version = "0.0.0"
description = "Oops-enheimer scene-to-FLUKA compiler."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pydantic",
  "typer",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
radcraft = "radcraft_compiler.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radcraft_compiler*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
