[project]
name = "radcraft-fluka-runner"
version = "0.0.0"
description = "Oops-enheimer FLUKA worker."
requires-python = ">=3.11"
dependencies = [
  "celery",
  "numpy",
  "pydantic-settings",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["worker", "tasks", "runner", "parser"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
