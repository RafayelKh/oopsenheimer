services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: radcraft
      POSTGRES_USER: radcraft
      POSTGRES_PASSWORD: radcraft
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    image: python:3.13-slim
    working_dir: /workspace
    command: >
      sh -lc "pip install --no-cache-dir -e apps/api -e packages/compiler -e workers/fluka_runner
      && uvicorn app.main:app --app-dir apps/api --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://radcraft:radcraft@postgres:5432/radcraft
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RADCRAFT_CELERY_TASK_ALWAYS_EAGER: "true"
      RADCRAFT_SIM_MODE: mock
      STORAGE_ROOT: /workspace/storage
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      - ./storage:/workspace/storage
    depends_on:
      - postgres
      - redis

  worker:
    image: python:3.13-slim
    working_dir: /workspace/workers/fluka_runner
    command: >
      sh -lc "pip install --no-cache-dir -e /workspace/packages/compiler -e /workspace/workers/fluka_runner
      && celery -A worker.celery_app worker --loglevel=info"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RADCRAFT_CELERY_TASK_ALWAYS_EAGER: "false"
      RADCRAFT_SIM_MODE: mock
      STORAGE_ROOT: /workspace/storage
    volumes:
      - .:/workspace
      - ./storage:/workspace/storage
    depends_on:
      - redis

  web:
    image: node:24
    working_dir: /workspace/apps/web
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  web_node_modules:
