upstream oopsenheimer_api {
    server 127.0.0.1:8000;
}

upstream oopsenheimer_web {
    server 127.0.0.1:3000;
}

map $http_upgrade $oopsenheimer_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name oopsenheimer.xyz;

    return 301 https://oopsenheimer.xyz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.oopsenheimer.xyz;

    return 301 https://oopsenheimer.xyz$request_uri;
}

server {
    listen 128.140.37.247:443 ssl;
    server_name oopsenheimer.xyz;

    ssl_certificate /etc/letsencrypt/live/oopsenheimer.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oopsenheimer.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://oopsenheimer_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
    }

    location / {
        proxy_pass http://oopsenheimer_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oopsenheimer_connection_upgrade;
        proxy_read_timeout 300s;
    }
}
